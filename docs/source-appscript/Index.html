<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0F231B; --paper:#F3F5F3; --card:#FFFFFF; --brand:#1E8A52; --brand-dk:#15703F;
    --tint:#E7EFE9; --ink:#17251E; --muted:#5C6E64; --line:#DEE5E0; --amber:#B97B0F;
    --amber-bg:#F7ECD9; --red:#B3402F; --red-bg:#F6E4E0; --blue:#2F5FA8; --blue-bg:#E2EAF6;
    --mono:'IBM Plex Mono',ui-monospace,monospace; --disp:'Space Grotesk',sans-serif; --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:14px;line-height:1.5}
  a{color:var(--brand-dk)}
  ::selection{background:#CDE4D7}

  #busy{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;display:none;overflow:hidden;background:rgba(30,138,82,.15)}
  #busy.on{display:block}
  #busy:after{content:"";position:absolute;left:-40%;width:40%;top:0;bottom:0;background:var(--brand);animation:slide 1s linear infinite}
  @keyframes slide{to{left:100%}}

  header{background:var(--deep);color:#EAF3EC;border-bottom:3px solid var(--brand)}
  .hwrap{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:22px;min-height:58px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;padding:10px 0}
  .mark{width:30px;height:30px;border:2px solid var(--brand);border-radius:6px;display:flex;flex-direction:column;justify-content:center;gap:3px;padding:0 5px;background:rgba(30,138,82,.12)}
  .mark i{display:block;height:3px;border-radius:2px;background:#9FD4B4}
  .mark i:nth-child(2){background:var(--brand)}
  .brand b{font-family:var(--disp);font-size:17px;letter-spacing:.04em}
  .brand small{display:block;font-size:10.5px;color:#9DB3A4;letter-spacing:.02em;margin-top:-2px}
  nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
  nav button{appearance:none;border:0;background:transparent;color:#C5D6C9;font:600 13px var(--body);padding:8px 13px;border-radius:7px;cursor:pointer;letter-spacing:.01em}
  nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  nav button.on{background:var(--brand);color:#fff}
  .uchip{display:flex;align-items:center;gap:9px;padding:6px 0;margin-left:auto}
  .uname{font-weight:600;font-size:13px;color:#fff}
  .umail{font-size:11px;color:#9DB3A4}
  .rolebadge{font:600 10px var(--mono);letter-spacing:.06em;color:#0F231B;background:#9FD4B4;border-radius:4px;padding:3px 7px;text-transform:uppercase}

  main{max-width:1180px;margin:0 auto;padding:22px 20px 80px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .col{flex:1;min-width:300px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
  .ovl{font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .ovl:before{content:"";width:8px;height:8px;border:2px solid var(--brand);border-radius:2px;display:inline-block}
  h1{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:-.01em}
  h2{font-family:var(--disp);font-size:17px;font-weight:600}
  .sub{color:var(--muted);font-size:13px}
  .pagehead{display:flex;align-items:flex-start;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .pagehead .grow{flex:1;min-width:220px}
  .crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .crumb a{color:var(--brand-dk);text-decoration:none;font-weight:600;cursor:pointer}
  .crumb a:hover{text-decoration:underline}

  .btn{appearance:none;border:1px solid var(--brand);background:var(--brand);color:#fff;font:600 13px var(--body);padding:8px 15px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--brand-dk);border-color:var(--brand-dk)}
  .btn:disabled{opacity:.55;cursor:default}
  .btn.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--brand);color:var(--brand-dk);background:#fff}
  .btn.danger{background:#fff;color:var(--red);border-color:#E4C4BD}
  .btn.danger:hover{background:var(--red-bg)}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}
  .btn.lk{background:none;border:none;color:var(--brand-dk);padding:2px 4px;font-weight:600;text-decoration:none}
  .btn.lk:hover{text-decoration:underline;background:none}
  input,select,textarea{font:400 13.5px var(--body);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(30,138,82,.14)}
  textarea{resize:vertical;min-height:64px}
  label{display:block;font:600 12px var(--body);color:var(--muted);margin:0 0 5px}
  .frow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .frow>div{flex:1;min-width:140px}
  .req:after{content:" *";color:var(--red)}
  .hint{font-size:12px;color:var(--muted);margin-top:5px}

  .chip{display:inline-block;font:500 11.5px var(--body);background:var(--tint);color:#2C5240;border:1px solid #CFE0D5;border-radius:20px;padding:2px 9px;margin:2px 4px 2px 0}
  .badge{display:inline-block;font:600 11px var(--body);border-radius:5px;padding:2.5px 8px;border:1px solid transparent}
  .b-green{background:var(--tint);color:#1C6A42;border-color:#C6DCCD}
  .b-amber{background:var(--amber-bg);color:#8A5C0B;border-color:#E8D5AE}
  .b-red{background:var(--red-bg);color:var(--red);border-color:#E6C7C0}
  .b-grey{background:#EDF0EE;color:var(--muted);border-color:var(--line)}
  .b-blue{background:var(--blue-bg);color:var(--blue);border-color:#C9D7EC}
  .mono{font-family:var(--mono);font-size:12.5px}
  .money{font-family:var(--mono);font-weight:500;white-space:nowrap}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:15px 17px;cursor:pointer}
  .stat:hover{border-color:var(--brand)}
  .stat .n{font:600 25px var(--mono);color:var(--ink);line-height:1.12}
  .stat .t{font:600 11px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:5px}
  .stat .x{font-size:11.5px;color:var(--muted);margin-top:3px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:7px 10px;border-bottom:1.5px solid var(--line)}
  td{padding:9px 10px;border-bottom:1px solid #ECF0ED;vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tr.clk{cursor:pointer}
  tr.clk:hover td{background:#F6FAF7}
  .tnum-r{text-align:right}
  .empty{color:var(--muted);font-size:13px;padding:18px 6px;text-align:center}

  .tlx{list-style:none}
  .tlx li{position:relative;padding:0 0 14px 22px;border-left:2px solid var(--line);margin-left:7px}
  .tlx li:before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--brand)}
  .tlx li:last-child{padding-bottom:2px}
  .tlx .w{font:500 11px var(--mono);color:var(--muted)}
  .tlx .d{font-size:13px;margin-top:1px}

  #mwrap{position:fixed;inset:0;background:rgba(15,35,27,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:34px 14px;overflow-y:auto}
  #mwrap.on{display:flex}
  #mcard{background:#fff;border-radius:12px;width:100%;max-width:560px;border-top:4px solid var(--brand);box-shadow:0 18px 50px rgba(15,35,27,.28)}
  #mcard.wide{max-width:880px}
  #mhead{display:flex;align-items:center;gap:12px;padding:16px 20px 0}
  #mhead h2{flex:1}
  #mx{appearance:none;border:0;background:#EDF1EE;color:var(--muted);width:28px;height:28px;border-radius:7px;font-size:15px;cursor:pointer;line-height:1}
  #mx:hover{background:var(--line);color:var(--ink)}
  #mbody{padding:14px 20px 6px;max-height:calc(100vh - 220px);overflow-y:auto}
  #mfoot{padding:12px 20px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

  #toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--deep);color:#EAF3EC;font:500 13px var(--body);padding:11px 18px;border-radius:9px;border-left:4px solid var(--brand);opacity:0;pointer-events:none;transition:all .25s;z-index:120;max-width:90vw}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{border-left-color:var(--red)}

  .kv{display:grid;grid-template-columns:130px 1fr;gap:7px 12px;font-size:13px}
  .kv b{font-weight:600;color:var(--muted);font-size:12px}
  .tagpick{display:flex;flex-wrap:wrap;gap:6px}
  .tagpick button{appearance:none;font:500 12px var(--body);border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:18px;padding:4px 11px;cursor:pointer}
  .tagpick button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .lockcard{max-width:480px;margin:80px auto;background:#fff;border:1px solid var(--line);border-top:4px solid var(--amber);border-radius:12px;padding:30px;text-align:center}
  .lockcard h1{margin-bottom:10px}
  .lines th,.lines td{padding:6px 7px}
  .lines input{padding:6px 8px;font-size:13px}
  .lines .num{text-align:right;font-family:var(--mono)}
  .totrow{display:flex;justify-content:flex-end;gap:14px;align-items:center;font-size:13.5px;padding:5px 8px}
  .totrow b{min-width:120px;text-align:right}
  .filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  tr.fr th{padding:3px 6px;background:#F3F6F4;position:sticky;top:0}
  .bubbles{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
  .bub{border:1px solid var(--brand);color:var(--brand);background:#F4FAF6;border-radius:20px;padding:4px 12px;font-size:12.5px;cursor:pointer}
  .bub:hover{background:var(--brand);color:#fff}
  .reslist{border:1px solid var(--line);border-radius:8px;max-height:200px;overflow:auto;margin-top:6px}
  .resrow{padding:8px 10px;cursor:pointer;border-bottom:1px solid #EEF1EF}
  .resrow:last-child{border-bottom:none}
  .resrow:hover,.resrow.on{background:#F4FAF6}
  .fx{width:100%;min-width:80px;font-size:11.5px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:#fff}
  table.grid tr.nc{background:#FDF3F3}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
  .pill.red{background:#FBE4E4;color:#B42318}
  .filterbar input,.filterbar select{width:auto;min-width:140px}
  .listedit{font-family:var(--mono);font-size:12.5px;min-height:120px}
  .qr{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;flex-wrap:wrap}
  .qr:hover{border-color:var(--brand)}
  .map-grid{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .map-grid select{width:auto}
  table.grid th{padding:6px 8px}
  table.grid td{padding:3px 6px;border-bottom:1px solid #ECF0ED}
  .ce{padding:4px 6px;font-size:12.5px;border:1px solid transparent;background:transparent;border-radius:5px;width:100%;min-width:90px}
  .ce:hover{border-color:var(--line);background:#fff}
  .ce:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 2px rgba(30,138,82,.12)}
  select.ce{min-width:90px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{appearance:none;border:0;background:#fff;color:var(--ink);font:600 13px var(--body);padding:8px 16px;cursor:pointer;border-right:1px solid var(--line)}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--brand);color:#fff}

  .fu{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;flex-wrap:wrap}
  .fu.due{border-left:3px solid var(--amber)}
  .fu.over{border-left:3px solid var(--red)}
  .fu .gr{flex:1;min-width:150px}

  #qlbtn{position:fixed;right:18px;bottom:18px;z-index:80;border:none;background:var(--brand);color:#fff;font:600 14px var(--body);padding:13px 19px;border-radius:30px;box-shadow:0 6px 20px rgba(15,35,27,.30);cursor:pointer;display:none}
  #qlbtn:hover{background:var(--brand-dk)}
  .ql-res{border:1px solid var(--line);border-radius:8px;max-height:200px;overflow:auto;margin-top:8px}
  .ql-res .qr{margin:0;border:0;border-bottom:1px solid #ECF0ED;border-radius:0;cursor:pointer}
  .ql-res .qr:last-child{border-bottom:0}
  .ql-res .qr:hover{background:#F6FAF7}

  @media(max-width:720px){
    nav{order:3;width:100%;margin-top:2px}
    .uchip{margin-left:0}
    .hwrap{gap:8px;padding:0 14px}
    main{padding:16px 14px 92px}
    .stats{grid-template-columns:repeat(2,1fr)}
    h1{font-size:19px}
    .kv{grid-template-columns:108px 1fr}
    #mbody{max-height:calc(100vh - 170px)}
  }
</style>
</head>
<body>
<div id="busy"></div>
<header id="hdr" style="display:none">
  <div class="hwrap">
    <div class="brand">
      <div class="mark"><i></i><i></i><i></i></div>
      <div><b>AS CRM</b><small>Automation Systems NG</small></div>
    </div>
    <nav id="nav">
      <button data-v="dash" onclick="nav('dash')">Dashboard</button>
      <button data-v="customers" id="navCust" onclick="nav('customers')">Customers</button>
      <button data-v="cases" id="navCases" onclick="nav('cases')">Cases</button>
      <button data-v="admin" id="navAdmin" style="display:none" onclick="nav('admin')">Admin</button>
    </nav>
    <div class="uchip">
      <div style="text-align:right">
        <div class="uname" id="uName"></div>
        <div class="umail" id="uMail"></div>
      </div>
      <span class="rolebadge" id="uRole"></span>
    </div>
  </div>
</header>

<main id="main"></main>
<button id="qlbtn" onclick="mQuickLog()">＋ Quick log</button>

<div id="mwrap">
  <div id="mcard">
    <div id="mhead"><h2 id="mtitle"></h2><button id="mx" onclick="closeModal()">✕</button></div>
    <div id="mbody"></div>
    <div id="mfoot"></div>
  </div>
</div>

<div id="toast"></div>

<script>var BOOT = <?!= boot ?>;</script>
<script id="appjs">
/* =====================================================================
 * AS CRM — client app. Pairs with Code.gs (google.script.run API).
 * =================================================================== */
var QREADS = { api_bootstrap:1, api_workspace:1, api_dashboard:1, api_getCase:1, api_getCustomer:1, api_searchCustomers:1, api_myCustomers:1, api_listCases:1, api_getQuotation:1, api_listTemplates:1, api_listAssignableUsers:1, api_admin_listUsers:1, api_admin_links:1 };

/* ---------------------------------------------------------------------
 * Client-side store. Apps Script costs ~0.3-1s per call no matter how
 * fast the server is, so the app never waits on it: views render from
 * memory instantly and revalidate in the background (stale-while-
 * revalidate). Writes are optimistic. This is what makes it feel native.
 * ------------------------------------------------------------------- */
var CACHE = { customers:null, customersAt:0, cases:null, casesAt:0, casesKey:'', cust:{}, kase:{} };
var FRESH_MS = 90000;
function fresh(at){ return at && (Date.now()-at) < FRESH_MS; }
function sameData(a,b){ try{ return JSON.stringify(a)===JSON.stringify(b); }catch(e){ return false; } }
function cacheBust(){ CACHE.customers=null; CACHE.cases=null; CACHE.cust={}; CACHE.kase={}; S.boot=null; }
var S = {
  user:null, settings:null, route:'dash', routeArg:null, boot:null, bootAt:0,
  custQ:'', caseF:{mine:false, stage:'', outcome:'Open', q:''},
  users:null, peers:[]
};

/* ---------------- tiny helpers ---------------- */
function el(id){ return document.getElementById(id); }
function low(s){ return String(s===null||s===undefined?'':s).toLowerCase().trim(); }
function esc(v){
  return String(v===null||v===undefined?'':v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtMoney(n){
  var v = Number(n||0);
  try{ return v.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  catch(e){ return v.toFixed(2); }
}
function fmtShort(n){
  var v = Number(n||0);
  try{ return v.toLocaleString('en-IN',{maximumFractionDigits:0}); }catch(e){ return String(Math.round(v)); }
}
function moneyCell(cur,n){
  if(n===''||n===null||n===undefined) return '<span class="sub">—</span>';
  return '<span class="money">'+esc(cur||'INR')+' '+fmtMoney(n)+'</span>';
}
function errMsg(e){
  var m = (e && e.message) ? e.message : String(e);
  return m.replace(/^(Error|Exception|ScriptError):\s*/,'');
}
var busyN = 0;
function busy(on){ busyN += on?1:-1; if(busyN<0) busyN=0; el('busy').className = busyN>0?'on':''; }
function gs(fn){
  var args = Array.prototype.slice.call(arguments,1);
  busy(true);
  return new Promise(function(res,rej){
    var done=false;
    var timer=setTimeout(function(){ if(done)return; done=true; busy(false); rej(new Error('This is taking longer than usual — tap Retry.')); }, 30000);
    var r = google.script.run
      .withSuccessHandler(function(v){ if(done)return; done=true; clearTimeout(timer); busy(false); if(!QREADS[fn]) cacheBust(); res(v); })
      .withFailureHandler(function(e){ if(done)return; done=true; clearTimeout(timer); busy(false); rej(e); });
    r[fn].apply(r,args);
  });
}
var toastT = null;
function toast(msg, isErr){
  var t = el('toast'); t.textContent = msg; t.className = 'on'+(isErr?' err':'');
  clearTimeout(toastT); toastT = setTimeout(function(){ t.className=''; }, isErr?5200:3400);
}
function oops(e){ toast(errMsg(e), true); }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ---------------- modal ---------------- */
function openModal(title, bodyHTML, footHTML, wide){
  el('mtitle').textContent = title;
  el('mbody').innerHTML = bodyHTML;
  el('mfoot').innerHTML = footHTML || '';
  el('mcard').className = wide?'wide':'';
  el('mwrap').className = 'on';
}
function closeModal(){ el('mwrap').className=''; el('mbody').innerHTML=''; el('mfoot').innerHTML=''; }
el('mwrap').addEventListener('click', function(ev){ if(ev.target===el('mwrap')) closeModal(); });
document.addEventListener('keydown', function(ev){ if(ev.key==='Escape') closeModal(); });
function v(id){ var n = el(id); return n ? n.value.trim() : ''; }

/* ---------------- chips ---------------- */
function tagChips(tags){
  if(!tags || !tags.length) return '<span class="sub">—</span>';
  return tags.map(function(t){ return '<span class="chip">'+esc(t)+'</span>'; }).join('');
}
function stageChip(stage){ return '<span class="badge b-blue">'+esc(stage||'—')+'</span>'; }
function outcomeChip(o){
  var k = o==='Won'?'b-green':(o==='Lost'?'b-red':(o==='Hold'?'b-amber':'b-grey'));
  return '<span class="badge '+k+'">'+esc(o)+'</span>';
}
function caseStatusChip(stage, outcome){ return outcome ? outcomeChip(outcome) : stageChip(stage); }
function priChip(p){
  if(!p) return '';
  var k = p==='High'?'b-red':(p==='Medium'?'b-amber':'b-grey');
  return '<span class="badge '+k+'">'+esc(p)+'</span>';
}
function typeChip(t){ return t ? '<span class="badge b-grey">'+esc(t)+'</span>' : ''; }
function qStatusChip(s){
  var k = s==='Accepted'?'b-green':(s==='Rejected'?'b-red':(s==='Sent'?'b-blue':(s==='Superseded'?'b-grey':'b-amber')));
  return '<span class="badge '+k+'">'+esc(s)+'</span>';
}
function accessBadge(a){
  return a==='FULL' ? '<span class="badge b-green">Full access</span>' : '<span class="badge b-grey">Name only</span>';
}

/* ---------------- pickers ---------------- */
function tgTag(btn){ btn.className = btn.className==='on'?'':'on'; }
function tagPickerHTML(id, all, selected, withStar){
  var sel = selected||[];
  var html = '<div class="tagpick" id="'+id+'">';
  if(withStar) html += '<button type="button" data-t="*" class="'+(sel.indexOf('*')>-1?'on':'')+'" onclick="tgTag(this)">All tags (*)</button>';
  (all||[]).forEach(function(t){
    html += '<button type="button" data-t="'+esc(t)+'" class="'+(sel.indexOf(t)>-1?'on':'')+'" onclick="tgTag(this)">'+esc(t)+'</button>';
  });
  return html+'</div>';
}
function multiPickHTML(id, items, sel){
  sel = sel||[];
  var html = '<div class="tagpick" id="'+id+'">';
  (items||[]).forEach(function(it){
    html += '<button type="button" data-t="'+esc(it.val)+'" class="'+(sel.indexOf(it.val)>-1?'on':'')+'" onclick="tgTag(this)">'+esc(it.label)+'</button>';
  });
  return html+'</div>';
}
function pickerVal(id){
  var out = []; var n = el(id); if(!n) return out;
  n.querySelectorAll('button.on').forEach(function(b){ out.push(b.getAttribute('data-t')); });
  return out;
}
function selOptions(list, sel){
  return (list||[]).map(function(o){ return '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>'; }).join('');
}
function userSelectHTML(id, selEmail){
  var sel = low(selEmail||(S.user?S.user.email:''));
  var html = '<select id="'+id+'">';
  (S.users||[]).forEach(function(u){
    html += '<option value="'+esc(u.email)+'"'+(low(u.email)===sel?' selected':'')+'>'+esc(u.name)+(low(u.email)===low(S.user.email)?' (me)':'')+'</option>';
  });
  return html+'</select>';
}
function catPickItems(){ return (S.settings.categories||[]).map(function(c){ return {val:c, label:c}; }); }
function userPickItems(){ return (S.users||[]).map(function(u){ return {val:u.email, label:u.name+(low(u.email)===low(S.user.email)?' (me)':'')}; }); }

/* ---------------- level helpers ---------------- */
function lvl(){ return S.user ? Number(S.user.level||1) : 1; }
function isAdmin(){ return lvl()>=6; }
function isBackend(){ return lvl()>=5; }   // L5/L6 — no personal sales performance dashboard
function canAssign(){ return lvl()>=2; }

function ensureUsers(){
  if(S.users) return Promise.resolve(S.users);
  return gs('api_listAssignableUsers').then(function(list){ S.users = list; return list; });
}

/* ---------------- boot / lock ---------------- */
function renderLock(){
  var r = String(BOOT.reason||'');
  var msg, title='Access pending';
  if(r.indexOf('NOT_REGISTERED:')===0){ msg = r.replace('NOT_REGISTERED:','').trim(); title = 'You are not registered yet'; }
  else if(r.indexOf('Setup pending')>-1){ title = 'Setup pending'; msg = 'The CRM database has not been created yet. The administrator must open the Apps Script editor and run setupCRM() once, then reload this page.'; }
  else{ msg = r || 'Could not sign you in.'; }
  el('main').innerHTML =
    '<div class="lockcard"><div class="mark" style="margin:0 auto 16px"><i></i><i></i><i></i></div>'+
    '<h1>'+esc(title)+'</h1><p class="sub" style="margin-bottom:18px">'+esc(msg)+'</p>'+
    (BOOT.email?'<p class="mono sub" style="margin-bottom:18px">Signed in as '+esc(BOOT.email)+'</p>':'')+
    '<button class="btn" onclick="location.reload()">Reload</button></div>';
}

function bootstrap(force){
  if(!force && S.boot && (Date.now()-S.bootAt)<45000) return Promise.resolve(S.boot);
  return gs('api_bootstrap').then(function(d){ S.boot=d; S.bootAt=Date.now(); return d; });
}
// Warm the whole app in a single call so the first tab switch costs nothing.
function warm(){
  return gs('api_workspace', S.caseF).then(function(w){
    if(w.boot){ S.boot=w.boot; S.bootAt=Date.now(); }
    if(w.customers){ CACHE.customers=w.customers; CACHE.customersAt=Date.now(); }
    if(w.cases){ CACHE.cases=w.cases; CACHE.casesAt=Date.now(); CACHE.casesKey=JSON.stringify(S.caseF); }
    return w.boot;
  });
}
function init(){
  warm().then(function(d){
    S.user = d.user; S.settings = d.settings; S.peers = d.peers||[];
    el('uName').textContent = d.user.name;
    el('uMail').textContent = d.user.email;
    el('uRole').textContent = d.user.role;
    if(d.nav && d.nav.admin) el('navAdmin').style.display='';
    if(d.isL1){ el('navCust').style.display='none'; el('navCases').style.display='none'; }
    if(lvl()>=2) el('qlbtn').style.display='';
    el('hdr').style.display='';
    vDash(d);
  }).catch(function(e){
    el('hdr').style.display='';
    el('main').innerHTML = '<div class="lockcard"><h1>Could not load</h1><p class="sub" style="margin:12px 0 18px">'+esc(errMsg(e))+'</p><button class="btn" onclick="location.reload()">Reload</button></div>';
  });
}

function setTab(name){
  document.querySelectorAll('#nav button').forEach(function(b){ b.className = b.getAttribute('data-v')===name ? 'on':''; });
}
function nav(name, arg){
  if(name==='dash') vDash();
  else if(name==='customers') vCustomers();
  else if(name==='customer') vCustomer(arg);
  else if(name==='case') vCase(arg);
  else if(name==='cases') vCases();
  else if(name==='admin') vAdmin();
}

/* =====================================================================
 * DASHBOARD
 * =================================================================== */
function vDash(pre){
  S.route='dash'; S.routeArg=null; setTab('dash');
  el('main').innerHTML = '<div class="sub">Loading dashboard…</div>';
  var p = pre ? Promise.resolve(pre) : bootstrap();
  p.then(function(d){
    S.user = d.user; S.settings = d.settings; S.peers = d.peers||[];
    if(d.isL1){ renderL1Dash(d); return; }
    if(d.isBackend || isBackend()){ renderBackendDash(d); return; }

    var html = '<div class="pagehead"><div class="grow"><h1>Dashboard</h1>'+
      '<div class="sub">Your performance and open work.</div></div>';
    if(S.peers.length){
      html += '<div><label>Whose dashboard</label><select id="dashWho" onchange="switchDash()"><option value="">Me ('+esc(S.user.name)+')</option>'+
        S.peers.map(function(p){ return '<option value="'+esc(p.email)+'">'+esc(p.name)+'</option>'; }).join('')+'</select></div>';
    } else if(lvl()>=3){
      html += '<div class="sub" style="align-self:center">No other users to view yet.</div>';
    }
    html += '<button class="btn" onclick="nav(\'customers\')">+ New customer</button></div>';
    html += '<div id="dashBlocks"></div>';
    html += '<div class="card"><div class="ovl">Recent activity</div>'+ recentHTML(d.recent) +'</div>';
    el('main').innerHTML = html;
    el('dashBlocks').innerHTML = dashBlocksHTML(d.self, low(S.user.email), false);
  }).catch(oops);
}

function switchDash(){
  var who = v('dashWho');
  if(!who){
    if(isBackend()){ el('dashBlocks').innerHTML = backendPrompt(); return; }
    bootstrap().then(function(d){ el('dashBlocks').innerHTML = dashBlocksHTML(d.self, low(S.user.email), false); }).catch(oops);
    return;
  }
  gs('api_dashboard', who).then(function(r){
    el('dashBlocks').innerHTML =
      '<div class="card" style="border-left:4px solid var(--blue);padding:12px 16px"><b>Viewing '+esc(r.subject.name)+'</b> <span class="sub">read only</span></div>'+
      dashBlocksHTML(r.dash, low(r.subject.email), true);
  }).catch(oops);
}

/* ---- L5/L6 back-office dashboard: no personal sales stats ---- */
function backendPrompt(){
  return S.peers.length
    ? '<div class="card"><div class="empty">Select a user above to view their dashboard.</div></div>'
    : '<div class="card"><div class="empty">No sales users to display yet.</div></div>';
}
function renderBackendDash(d){
  var html = '<div class="pagehead"><div class="grow"><h1>Overview</h1>'+
    '<div class="sub">Back-office view — full access across all tags, no personal sales targets.</div></div>';
  if(S.peers.length){
    html += '<div><label>View a user\u2019s dashboard</label><select id="dashWho" onchange="switchDash()"><option value="">\u2014 select a user \u2014</option>'+
      S.peers.map(function(p){ return '<option value="'+esc(p.email)+'">'+esc(p.name)+'</option>'; }).join('')+'</select></div>';
  }

    '<button class="btn ghost" onclick="nav(\'cases\')">Cases</button>'+

function dashBlocksHTML(dash, subjectEmail, readOnly){

    '<div class="stat" onclick="goCases({mine:true,outcome:\'Open\'})"><div class="n">'+s.myCustomers+'</div><div class="t">My customers</div></div>'+
    '<div class="stat" onclick="goCases({mine:true,outcome:\'Open\'})"><div class="n">'+s.openOpps+'</div><div class="t">Open cases</div></div>'+
    '<div class="stat"><div class="n">'+esc(S.settings.currency)+' '+fmtShort(s.wonMonthValue)+'</div><div class="t">Won this month</div><div class="x">'+s.wonMonthCount+' order'+(s.wonMonthCount===1?'':'s')+'</div></div>'+
    '<div class="stat"><div class="n">'+esc(S.settings.currency)+' '+fmtShort(s.won2wValue)+'</div><div class="t">Won — last 2 weeks</div><div class="x">'+s.won2wCount+' order'+(s.won2wCount===1?'':'s')+'</div></div>'+

function caseValueCell(o){
  var cur=S.settings.currency;
  if(o.outcome==='Won') return moneyCell(cur,o.orderValue);
  if(o.quotedValue!=='' && o.quotedValue!=null && Number(o.quotedValue)>0)
    return '<span class="sub" style="font-weight:400">quoted </span>'+moneyCell(cur,o.quotedValue);
  return moneyCell(cur,'');
}
function openCasesHTML(list){
  if(!list || !list.length) return '<div class="empty">No open cases assigned to you.</div>';
  return list.map(function(c){
    return '<div class="qr"><div style="flex:1;min-width:150px;cursor:pointer" onclick="nav(\'case\',\''+esc(c.id)+'\')"><b>'+esc(c.title)+'</b>'+
      '<div class="sub">'+esc(c.customerName)+'</div></div>'+stageChip(c.stage)+
      '<button class="btn ghost sm" onclick="event.stopPropagation();mAssign(\''+esc(c.id)+'\')">Reassign</button></div>';
  }).join('');
}
function recentHTML(recent){
  if(!recent || !recent.length) return '<div class="empty">Nothing yet.</div>';
  var html = '<ul class="tlx">';
  recent.forEach(function(r){
    html += '<li><div class="w">'+esc(r.when)+' · '+esc(r.who)+' · '+esc(r.action)+'</div><div class="d">'+esc(r.details||r.entity)+'</div></li>';
  });
  return html+'</ul>';
}
function goCases(f){ S.caseF = {mine:!!f.mine, stage:f.stage||'', outcome:f.outcome||'', q:''}; vCases(); }

/* ---- L1 minimal dashboard ---- */

/* =====================================================================
 * CUSTOMERS — search + list
 * =================================================================== */
var searchT = null;
function vCustomers(){
  S.route='customers'; S.routeArg=null; setTab('customers');
  el('main').innerHTML =
    '<div class="pagehead"><div class="grow"><h1>Customers</h1><div class="sub">Search first — if the customer isn\'t there, create it from the search result.</div></div>'+
    '<button class="btn ghost" onclick="mBulkCustomers()">Bulk add</button></div>'+
    '<div class="card"><input id="custQ" placeholder="Search customers by name, tag, type or area…" value="'+esc(S.custQ)+'" oninput="custTyped()"></div>'+
    '<div id="custBody"></div>';
  el('custQ').focus();
  custApply();
}
function custTyped(){ S.custQ=v('custQ'); clearTimeout(searchT); searchT=setTimeout(custApply, 300); }
function custApply(){
  var q=v('custQ'); S.custQ=q;
  if(q.length===0){ loadGrid(); return; }
  if(q.length<2){ el('custBody').innerHTML='<div class="card"><div class="empty">Keep typing — at least 2 characters.</div></div>'; return; }
  runSearch(q);
}
function createBar(q){
  return '<div class="qr" style="border-color:var(--brand);background:#F6FAF7;margin-bottom:12px">'+
    '<div style="flex:1;min-width:170px"><b>Not in the list?</b><div class="sub">Create a new customer named "'+esc(q)+'".</div></div>'+
    '<button class="btn" onclick="mNewCustomer(\''+esc(q).replace(/'/g,"\\'")+'\')">+ Create "'+esc(q)+'"</button></div>';
}
function runSearch(q){
  el('custBody').innerHTML='<div class="card"><div class="sub">Searching…</div></div>';
  gs('api_searchCustomers', q).then(function(list){
    if(v('custQ')!==q) return;
    if(!list.length){
      el('custBody').innerHTML='<div class="card"><div class="empty">No customers match "'+esc(q)+'".</div>'+createBar(q)+'</div>';
      return;
    }
    var html='<div class="ovl">Search results</div>'+createBar(q)+'<div style="overflow-x:auto"><table><tr><th>Customer</th><th>Tag</th><th>Type</th><th>Priority</th><th>Handlers</th><th></th></tr>';
    list.forEach(function(c){
      var extra = c.access==='FULL' ? '<div class="sub">'+esc(c.area||'')+'</div>' : '';
      var click = c.access==='FULL' ? 'nav(\'customer\',\''+esc(c.id)+'\')' : 'mRestricted(\''+esc(c.id)+'\')';
      html += '<tr class="clk" onclick="'+click+'"><td><b>'+esc(c.name)+'</b>'+extra+'</td><td>'+tagChips(c.tags)+'</td>'+
        '<td>'+(typeChip(c.type)||'<span class="sub">—</span>')+'</td><td>'+(priChip(c.priority)||'<span class="sub">—</span>')+'</td>'+
        '<td class="sub">'+esc((c.handlers||[]).join(', ')||'—')+'</td><td>'+accessBadge(c.access)+'</td></tr>';
    });
    el('custBody').innerHTML='<div class="card">'+html+'</table></div><div class="hint">Showing up to 80 results.</div></div>';
  }).catch(function(e){ el('custBody').innerHTML='<div class="card"><div class="empty">'+esc(errMsg(e))+'</div></div>'; });
}

var MCBLANK='__BLANK__';   // sentinel for "filter to empty values" (HTML-safe)
var MC=null, MCHSEL=[], MCSEL={};
var MCFILT={name:'',tag:'',type:'',priority:'',area:'',sei:'',remarks:'',contacts:'',handler:''};
function gridIsAll(){ return lvl()>=5; }
function otherHandlers(c){ return (c.handlers||[]).filter(function(h){ return low(h.email)!==low(S.user.email); }); }
function allHandlerObjs(){
  var seen={}, out=[];
  (MC?MC.customers:[]).forEach(function(c){ (c.handlers||[]).forEach(function(h){ var k=low(h.email); if(!seen[k]){ seen[k]=1; out.push({email:k,name:h.name}); } }); });
  out.sort(function(a,b){ return a.name<b.name?-1:1; });
  return out;
}
function mcOtherHandlerList(){
  var seen={}, out=[];
  (MC?MC.customers:[]).forEach(function(c){ otherHandlers(c).forEach(function(h){ if(!seen[h.email]){ seen[h.email]=1; out.push(h); } }); });
  out.sort(function(a,b){ return a.name<b.name?-1:1; });
  return out;
}
function gridShell(inner){
  var all=gridIsAll();
  el('custBody').innerHTML='<div class="card"><div class="ovl">'+(all?'All customers':'My customers')+' <span id="mcCount" class="sub"></span>'+
    (all?' <button class="btn ghost sm" style="margin-left:8px" onclick="loadAllCustomers(true)">Refresh</button>':'')+'</div>'+
    '<p class="hint" style="margin-top:-4px">'+(all?'Every customer in the database. Handlers are the owners; a customer with no user yet shows "Direct".':'Customers you handle. Edit cells inline — changes save automatically.')+'</p>'+
    '<div id="mcWrap">'+inner+'</div></div>';
}
function gridBusy(){
  if(Object.keys(PENDING).length) return true;
  var a=document.activeElement;
  return !!(a && a.className && String(a.className).indexOf('ce')>-1);
}
function loadGrid(force){ if(gridIsAll()) loadAllCustomers(force); else loadMyCustomers(); }
function loadMyCustomers(){
  MCSEL={};
  var have=(CACHE.customers && CACHE.customers.scope==='mine')?CACHE.customers:null;
  if(have){ MC=have; gridShell(''); renderMyCustomers(); }
  else gridShell('<div class="sub">Loading…</div>');
  if(have && fresh(CACHE.customersAt)) return;
  gs('api_myCustomers').then(function(d){
    CACHE.customers=d; CACHE.customersAt=Date.now();
    if(S.route!=='customers' || v('custQ')) return;
    if(gridBusy()){ MC=d; return; }
    if(sameData(MC,d)){ MC=d; return; }
    MC=d; if(!el('mcWrap')) gridShell(''); renderMyCustomers();
  }).catch(function(e){
    if(have) return;
    if(el('mcWrap')) el('mcWrap').innerHTML='<div class="empty">'+esc(errMsg(e))+'<div style="margin-top:10px"><button class="btn ghost sm" onclick="loadMyCustomers()">Retry</button></div></div>';
  });
}
function loadAllCustomers(force){
  MCSEL={};
  var have=(CACHE.customers && CACHE.customers.scope==='all')?CACHE.customers:null;
  if(!force && !have){
    el('custBody').innerHTML='<div class="card"><div class="ovl">All customers</div>'+
      '<p class="hint" style="margin-top:-4px">The full customer list can be large, so it is fetched only when you ask (search above works without fetching).</p>'+
      '<button class="btn" onclick="loadAllCustomers(true)">Fetch all customers</button></div>';
    return;
  }
  if(have){ MC=have; gridShell(''); renderMyCustomers(); }
  else gridShell('<div class="sub">Fetching…</div>');
  gs('api_allCustomers').then(function(d){
    CACHE.customers=d; CACHE.customersAt=Date.now();
    if(S.route!=='customers' || v('custQ')) return;
    if(gridBusy()){ MC=d; return; }
    if(have && sameData(MC,d)){ MC=d; return; }
    MC=d; if(!el('mcWrap')) gridShell(''); renderMyCustomers();
  }).catch(function(e){
    if(have) return;
    if(el('mcWrap')) el('mcWrap').innerHTML='<div class="empty">'+esc(errMsg(e))+'<div style="margin-top:10px"><button class="btn ghost sm" onclick="loadAllCustomers(true)">Retry</button></div></div>';
  });
}
function mcTextMatch(val,f){ return !f || low(val||'').indexOf(low(f))>-1; }
function mcFiltered(){
  if(!MC) return [];
  var all=gridIsAll();
  return MC.customers.filter(function(c){
    if(!mcTextMatch(c.name,MCFILT.name)) return false;
    if(!mcTextMatch(c.area,MCFILT.area)) return false;
    if(!mcTextMatch(c.sei,MCFILT.sei)) return false;
    if(!mcTextMatch(c.remarks,MCFILT.remarks)) return false;
    if(MCFILT.tag){ if(MCFILT.tag===MCBLANK){ if((c.tags||[]).length) return false; } else if((c.tags||[]).indexOf(MCFILT.tag)<0) return false; }
    if(MCFILT.type){ if(MCFILT.type===MCBLANK){ if(c.type) return false; } else if(c.type!==MCFILT.type) return false; }
    if(MCFILT.priority){ if(MCFILT.priority===MCBLANK){ if(c.priority) return false; } else if(c.priority!==MCFILT.priority) return false; }
    if(MCFILT.contacts==='0' && (c.contacts||0)!==0) return false;
    if(MCFILT.contacts==='1' && (c.contacts||0)===0) return false;
    if(all){
      if(MCHSEL.length){ var he=(c.handlers||[]).map(function(h){ return low(h.email); }); for(var i=0;i<MCHSEL.length;i++){ if(he.indexOf(low(MCHSEL[i]))<0) return false; } }
    } else if(MCFILT.handler){
      var oth=otherHandlers(c).map(function(h){ return low(h.email); });
      if(MCFILT.handler===MCBLANK){ if(oth.length) return false; } else if(oth.indexOf(low(MCFILT.handler))<0) return false;
    }
    return true;
  });
}
function mcSelCount(){ return Object.keys(MCSEL).filter(function(id){ return MCSEL[id]; }).length; }
function renderMyCustomers(){
  if(!el('mcWrap')) return;
  var d=MC, all=gridIsAll();
  if(el('mcCount')) el('mcCount').textContent='('+d.total+')';
  if(!d.customers.length){
    el('mcWrap').innerHTML='<div class="empty">'+(all?'No customers in the database yet.':'You don\'t handle any customers yet.<br>Create one with "+ New customer", or ask a handler to add you to theirs.')+'</div>';
    return;
  }
  var canPri=d.canEditPriority, canCls=d.canEditClass, canDel=d.canDelete;
  function eopts(list,val){ return '<option value="">—</option>'+list.map(function(t){ return '<option'+(t===val?' selected':'')+'>'+esc(t)+'</option>'; }).join(''); }
  function fsel(field,list){
    return '<select class="fx" onchange="mcSetFilter(\''+field+'\',this.value)"><option value="">All</option>'+
      list.map(function(t){ return '<option value="'+esc(t)+'"'+(MCFILT[field]===t?' selected':'')+'>'+esc(t)+'</option>'; }).join('')+
      '<option value="'+esc(MCBLANK)+'"'+(MCFILT[field]===MCBLANK?' selected':'')+'>(blank)</option></select>';
  }
  function ftext(field){ return '<input class="fx" placeholder="filter" value="'+esc(MCFILT[field])+'" oninput="mcSetFilter(\''+field+'\',this.value)">'; }
  var handlerFilterCell;
  if(all){
    handlerFilterCell='<button class="btn ghost sm" onclick="mcHandlerPicker()">'+(MCHSEL.length?('Handlers ('+MCHSEL.length+')'):'Filter…')+'</button>';
  } else {
    var oh=mcOtherHandlerList();
    handlerFilterCell='<select class="fx" onchange="mcSetFilter(\'handler\',this.value)"><option value="">All</option>'+
      oh.map(function(h){ return '<option value="'+esc(h.email)+'"'+(low(MCFILT.handler)===low(h.email)?' selected':'')+'>'+esc(h.name)+'</option>'; }).join('')+
      '<option value="'+esc(MCBLANK)+'"'+(MCFILT.handler===MCBLANK?' selected':'')+'>(blank — only me)</option></select>';
  }
  var rows=mcFiltered(), n=mcSelCount();
  var active=MCFILT.name||MCFILT.tag||MCFILT.type||MCFILT.priority||MCFILT.area||MCFILT.sei||MCFILT.remarks||MCFILT.contacts||MCFILT.handler||MCHSEL.length;
  var html='<div class="filterbar">'+
    '<span class="sub">'+rows.length+' of '+d.total+'</span>'+
    (canDel?'<button class="btn danger sm" id="mcDel" onclick="mcDelete()"'+(n?'':' style="display:none"')+'>Delete selected ('+n+')</button>':'')+
    (active?'<button class="btn ghost sm" onclick="mcClearFilters()">Clear filters</button>':'')+
    '</div>';
  var hcol = all ? 'Handlers' : 'Other handlers';
  html+='<div style="overflow-x:auto"><table class="grid">'+
    '<tr>'+
      (canDel?'<th style="width:24px"><input type="checkbox" '+(rows.length&&rows.every(function(c){return MCSEL[c.id];})?'checked':'')+' onclick="mcSelectAll(this.checked)"></th>':'')+
      '<th>Name</th><th>Tag</th><th>Type</th><th>Priority</th><th>Area</th><th>SEI</th><th>Remarks</th><th>Contacts</th><th>'+hcol+'</th><th></th>'+
    '</tr>'+
    '<tr class="fr">'+
      (canDel?'<th></th>':'')+

/* Optimistic editing: the value lands in the UI immediately and the write is
   batched and sent in the background. Only a failure interrupts the user. */
var PENDING={}, PREV={}, NODES={}, pendTimer=null;
function cellSave(id, field, value, node){
  var c = MC && MC.customers.filter(function(x){return x.id===id;})[0];
  if(c){
    PREV[id]=PREV[id]||{};
    if(!(field in PREV[id])) PREV[id][field]=c[field];
    c[field]=value;                                    // local model updated instantly
  }
  PENDING[id]=PENDING[id]||{}; PENDING[id][field]=value;
  NODES[id+'|'+field]=node;
  node.style.outline='2px solid var(--line)';          // quiet "not saved yet"
  clearTimeout(pendTimer);
  pendTimer=setTimeout(flushCells, 700);
}
function flushCells(){
  var ids=Object.keys(PENDING);
  if(!ids.length) return;
  var patches=ids.map(function(id){ return {id:id, fields:PENDING[id]}; });
  var sent=PENDING, sentNodes=NODES, sentPrev=PREV;
  PENDING={}; NODES={}; PREV={};
  gs('api_saveCustomerCells', patches).then(function(r){
    (r.saved||[]).forEach(function(id){
      Object.keys(sent[id]||{}).forEach(function(f){
        var n=sentNodes[id+'|'+f]; if(!n) return;
        n.style.outline='2px solid var(--brand)';
        setTimeout(function(){ n.style.outline=''; },600);
      });
    });
    (r.failed||[]).forEach(function(f){
      var id=f.id;
      Object.keys(sent[id]||{}).forEach(function(fld){
        var n=sentNodes[id+'|'+fld];
        if(n){ n.style.outline='2px solid var(--red)'; if('value' in n && sentPrev[id] && fld in sentPrev[id]) n.value=sentPrev[id][fld]; }
        var c=MC && MC.customers.filter(function(x){return x.id===id;})[0];
        if(c && sentPrev[id] && fld in sentPrev[id]) c[fld]=sentPrev[id][fld];
      });
      toast(f.error||'Could not save that change.', true);
    });
    CACHE.customers=MC; CACHE.customersAt=Date.now();
  }).catch(function(e){
    Object.keys(sent).forEach(function(id){
      Object.keys(sent[id]).forEach(function(fld){
        var n=sentNodes[id+'|'+fld];
        if(n){ n.style.outline='2px solid var(--red)'; if('value' in n && sentPrev[id] && fld in sentPrev[id]) n.value=sentPrev[id][fld]; }
        var c=MC && MC.customers.filter(function(x){return x.id===id;})[0];
        if(c && sentPrev[id] && fld in sentPrev[id]) c[fld]=sentPrev[id][fld];
      });
    });
    oops(e);
  });
}
window.addEventListener('beforeunload', function(ev){
  if(Object.keys(PENDING).length){ flushCells(); ev.preventDefault(); ev.returnValue=''; }
});

function vCase(id){
  S.route='case'; S.routeArg=id; setTab('cases');
  var hit=CACHE.kase[id];
  if(hit){ renderCase(hit.d); if(fresh(hit.at)) return; }
  else el('main').innerHTML = '<div class="sub">Loading case…</div>';
  gs('api_getCase', id).then(function(d){
    CACHE.kase[id]={d:d, at:Date.now()};
    if(S.route!=='case' || S.routeArg!==id) return;
    if(hit && sameData(hit.d,d)) return;
    renderCase(d);
  }).catch(function(e){ if(hit) return; el('main').innerHTML = '<div class="card"><div class="empty">'+esc(errMsg(e))+'<div style="margin-top:12px"><button class="btn ghost" onclick="nav(S.route,S.routeArg)">Retry</button></div></div></div>'; });
}
function renderCase(d){
    CUR.caseData = d;
    var o = d.case;
    var html = '<div class="pagehead"><div class="grow">'+
      '<div class="crumb"><a onclick="nav(\'customers\')">Customers</a> / <a onclick="nav(\'customer\',\''+esc(d.customer.id)+'\')">'+esc(d.customer.name)+'</a> / <span class="mono">'+esc(o.id)+'</span></div>'+
      '<h1>'+esc(o.title)+'</h1>'+
      '<div class="sub" style="margin-top:5px">'+caseStatusChip(o.stage,o.outcome)+
      ' &nbsp; Owners: <b>'+esc((o.owners||[]).join(', ')||'—')+'</b>'+
      (d.canEdit?' <button class="btn lk" onclick="mOwners()">manage</button>':'')+
      (o.outcome ? '' :
        ' &nbsp;·&nbsp; Assigned to: <b>'+esc(o.assignee||'nobody')+'</b>'+
        (d.canAssignTicket?' <button class="btn lk" onclick="mAssignCase()">reassign</button>':''))+
      '</div></div>';
    if(d.canEdit) html += '<button class="btn ghost" onclick="mEditCase(CUR.caseData.case)">Edit</button>'+
      '<button class="btn ghost" onclick="openBuilderForCase()">+ Quotation</button>'+
      '<button class="btn ghost" onclick="mUploadQuote()">Upload quotation</button>';
    html += '</div>';

    // status / stage controls
    html += '<div class="card"><div class="ovl">Status</div>';
    if(o.outcome==='Won'){
      html += '<p style="margin-bottom:8px">'+outcomeChip('Won')+' <b class="money">'+esc(S.settings.currency)+' '+fmtMoney(o.orderValue)+'</b> — '+
        (o.wonCategories||[]).map(function(c){ return '<span class="chip">'+esc(c)+'</span>'; }).join('')+
        (o.closedOn?' <span class="sub mono">· '+esc(o.closedOn)+'</span>':'')+'</p>';
    }else if(o.outcome==='Lost'){
      html += '<p style="margin-bottom:8px">'+outcomeChip('Lost')+(o.outcomeNote?' <span class="sub">— '+esc(o.outcomeNote)+'</span>':'')+(o.closedOn?' <span class="sub mono">· '+esc(o.closedOn)+'</span>':'')+'</p>';
    }else if(o.outcome==='Hold'){
      html += '<p style="margin-bottom:8px">'+outcomeChip('Hold')+(o.outcomeNote?' <span class="sub">— '+esc(o.outcomeNote)+'</span>':'')+' <span class="sub">(stage kept at '+esc(o.stage)+')</span></p>';
    }
    if(d.canEdit){
      if(o.outcome!=='Won' && o.outcome!=='Lost'){
        html += '<div class="frow" style="align-items:flex-end"><div><label>Stage</label><select id="stSel">'+
          S.settings.stages.map(function(st){ return '<option'+(st===o.stage?' selected':'')+'>'+esc(st)+'</option>'; }).join('')+'</select></div>'+
          '<div style="flex:2"><label>Note (optional)</label><input id="stNote" placeholder="e.g. BOQ received, costing in progress"></div>'+
          '<div style="flex:0"><button class="btn" onclick="doStage(\''+esc(o.id)+'\')">Update stage</button></div></div>';
      }
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">';
      if(o.outcome!=='Won') html += '<button class="btn sm" onclick="mWon(\''+esc(o.id)+'\')">Mark Won</button>';
      if(o.outcome!=='Lost') html += '<button class="btn danger sm" onclick="mOutcomeNote(\''+esc(o.id)+'\',\'Lost\')">Mark Lost</button>';
      if(o.outcome!=='Hold') html += '<button class="btn ghost sm" onclick="mOutcomeNote(\''+esc(o.id)+'\',\'Hold\')">Put on Hold</button>';
      if(o.outcome) html += '<button class="btn ghost sm" onclick="reopenCase(\''+esc(o.id)+'\')">Reopen</button>';
      html += '</div>';
    }
    html += '</div>';

    if(o.details){ html += '<div class="card"><div class="ovl">Details</div><div style="white-space:pre-wrap">'+esc(o.details)+'</div></div>'; }

    // quotations
    html += '<div class="card"><div class="ovl">Quotations</div>';
    if(!(d.quotes||[]).length) html += '<div class="empty">No quotations yet for this case.</div>';
    else{
      var groups = {}, order = [];
      d.quotes.forEach(function(q){ if(!groups[q.quoteNo]){ groups[q.quoteNo]=[]; order.push(q.quoteNo); } groups[q.quoteNo].push(q); });
      order.forEach(function(no){
        html += '<div style="margin-bottom:14px"><div class="mono" style="font-weight:600;margin-bottom:6px">'+esc(no)+'</div>';
        groups[no].forEach(function(q){
          html += '<div class="qr"><span class="mono">R'+q.rev+'</span>'+qStatusChip(q.status)+
            '<div style="flex:1;min-width:140px">'+esc(q.title)+'<div class="sub mono">'+esc(q.date)+' · '+esc(q.by)+'</div></div>'+
            '<span class="money">'+esc(q.currency)+' '+fmtMoney(q.total)+'</span>'+
            (q.pdf?'<a href="'+esc(q.pdf)+'" target="_blank" rel="noopener">PDF</a>':'')+
            '<button class="btn ghost sm" onclick="mQuoteViewer(\''+esc(q.quoteNo)+'\','+q.rev+')">Open</button></div>';
        });
        html += '</div>';
      });
    }
    html += '</div>';

    // history
    html += '<div class="card"><div class="ovl">History</div>';
    if(!(d.history||[]).length) html += '<div class="empty">No activity logged yet.</div>';
    else{
      html += '<ul class="tlx">';
      d.history.forEach(function(r){ html += '<li><div class="w">'+esc(r.when)+' · '+esc(r.who)+' · '+esc(r.action)+'</div><div class="d">'+esc(r.details)+'</div></li>'; });
      html += '</ul>';
    }
    html += '</div>';
    el('main').innerHTML = html;
}

function blockToText(b){
  if(!b || !b.headers || !b.headers.length) return '';
  return [b.headers.join('\t')].concat((b.rows||[]).map(function(r){ return r.join('\t'); })).join('\n');
}
function parseBlockText(text){
  var lines = String(text||'').split(/\r?\n/).map(function(l){ return l.replace(/\u00A0/g,' '); }).filter(function(l){ return l.trim()!==''; });
  if(!lines.length) return {headers:[], rows:[]};
  var grid = lines.map(function(l){ return l.indexOf('\t')>-1 ? l.split('\t') : l.split(','); });
  var cols=0; grid.forEach(function(r){ if(r.length>cols) cols=r.length; });
  grid = grid.map(function(r){ while(r.length<cols) r.push(''); return r.map(function(c){ return String(c).trim(); }); });
  var headers = grid[0].slice();
  while(headers.length && headers[headers.length-1]==='') headers.pop();
  var rows = grid.slice(1).map(function(r){ return r.slice(0,headers.length); }).filter(function(r){ return r.join('').trim()!==''; });
  return {headers:headers, rows:rows};
}
function captureBlocks(){
  B.blocks.forEach(function(b,i){ var t=el('qb_bt_'+i), x=el('qb_bx_'+i); if(t) b.title=t.value; if(x) b.text=x.value; });
}
function qbRenderBlocks(){
  var html='';
  B.blocks.forEach(function(b,i){
    html+='<div class="card" style="padding:12px;margin-bottom:10px;background:#fff">'+
      '<div class="frow" style="margin-bottom:8px"><div style="flex:2"><label>Table title (optional)</label><input id="qb_bt_'+i+'" value="'+esc(b.title||'')+'" placeholder="e.g. Main panel BOQ" oninput="captureBlocks()"></div>'+
      (B.blocks.length>1?'<div style="flex:0;display:flex;align-items:flex-end"><button class="btn danger sm" onclick="qbDelBlock('+i+')">Remove</button></div>':'')+'</div>'+
      '<textarea id="qb_bx_'+i+'" placeholder="Paste this table from Excel — first row = headers" style="min-height:80px;font-family:var(--mono);font-size:12px" oninput="captureBlocks();qbPreview('+i+')">'+esc(b.text||'')+'</textarea>'+
      '<div id="qb_bp_'+i+'" style="margin-top:8px;overflow-x:auto"></div></div>';
  });
  el('qb_blocks').innerHTML=html;
  B.blocks.forEach(function(b,i){ qbPreview(i); });
}
function qbPreview(i){
  var node=el('qb_bp_'+i); if(!node) return;
  var x=el('qb_bx_'+i); var text=x?x.value:(B.blocks[i]?B.blocks[i].text:'');
  var pr=parseBlockText(text);
  if(!pr.headers.length){ node.innerHTML='<span class="hint">No rows yet — paste a table above.</span>'; return; }
  var html='<table class="lines"><tr>'+pr.headers.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('')+'</tr>';
  pr.rows.slice(0,6).forEach(function(r){ html+='<tr>'+r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>'; });
  html+='</table><div class="hint">'+pr.rows.length+' row'+(pr.rows.length===1?'':'s')+(pr.rows.length>6?' (showing 6)':'')+'.</div>';
  node.innerHTML=html;
}
function qbAddBlock(){ captureBlocks(); B.blocks.push({title:'',text:''}); qbRenderBlocks(); }
function qbDelBlock(i){ captureBlocks(); B.blocks.splice(i,1); if(!B.blocks.length) B.blocks.push({title:'',text:''}); qbRenderBlocks(); }
function qbTotals(){
  if(!el('qb_tot')) return;
  var sub=Number(v('qb_sub'))||0, tax=Number(v('qb_tax'))||0, cur=v('qb_cur')||'INR';
  var ta=sub*tax/100;

    '<div class="totrow" style="font-size:15px"><span><b>Total</b></span><b class="money">'+esc(cur)+' '+fmtMoney(sub+ta)+'</b></div>';

function saveQuote(){

    '<div class="frow"><div><label class="req">Total value</label><input id="uq_total" type="number" min="0" step="0.01" value="'+esc(base.total!==undefined?base.total:'')+'"></div>'+
    '<div><label>Currency</label><input id="uq_cur" value="'+esc(base.currency||S.settings.currency)+'"></div>'+
    '<div><label>Valid until</label><input id="uq_valid" type="date" value="'+esc(base.validUntil||'')+'"></div></div>'+
    '<div class="frow"><div><label class="req">File</label><input id="uq_file" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx" onchange="uqPicked()"><div class="hint" id="uq_fname">No file chosen — up to about 8 MB.</div></div></div>'+
    '<div class="frow"><div><label>Notes</label><textarea id="uq_notes">'+esc(base.notes||'')+'</textarea></div></div>',
    '<button class="btn ghost" onclick="closeModal()">Cancel</button>'+
    '<button class="btn" id="uq_save" onclick="saveUpload()">Upload quotation</button>', true);
  el('uq_title').focus();
}
var UQ = null;
function uqPicked(){
  var f = el('uq_file').files[0];
  if(!f){ el('uq_fname').textContent='No file chosen — up to about 8 MB.'; return; }
  el('uq_fname').textContent = f.name+' — '+Math.round(f.size/1024)+' KB';
}
function saveUpload(){
  var f = el('uq_file').files[0];
  if(!f){ toast('Choose a file to upload.', true); return; }
  if(f.size > 8*1024*1024){ toast('That file is larger than 8 MB — please compress it first.', true); return; }
  if(!v('uq_title')){ toast('Give the quotation a title.', true); return; }
  if(v('uq_total')==='' || !(Number(v('uq_total'))>=0)){ toast('Enter the total value.', true); return; }
  var btn = el('uq_save'); btn.disabled = true; btn.textContent = 'Uploading…';
  var fr = new FileReader();
  fr.onerror = function(){ btn.disabled=false; btn.textContent='Upload quotation'; toast('Could not read that file.', true); };
  fr.onload = function(){
    var b64 = String(fr.result).split(',')[1];
    var p = {
      customerId: UQ.ctx.customerId,
      caseId: (UQ.ctx.lockCase || UQ.base.quoteNo) ? (UQ.base.caseId || UQ.ctx.caseId) : v('uq_case'),
      baseQuoteNo: UQ.base.quoteNo || '',
      title: v('uq_title'), status: v('uq_status'),
      total: v('uq_total'), currency: v('uq_cur'), validUntil: v('uq_valid'), notes: v('uq_notes'),
      fileName: f.name, mimeType: f.type || 'application/octet-stream', dataB64: b64
    };
    gs('api_uploadQuotation', p).then(function(r){
      toast('Uploaded '+r.quoteNo+' R'+r.rev+'.'); refreshBehind(); mQuoteViewer(r.quoteNo, r.rev);
    }).catch(function(e){ btn.disabled=false; btn.textContent='Upload quotation'; oops(e); });
  };
  fr.readAsDataURL(f);
}

function mQuoteViewer(quoteNo, rev){
  openModal(quoteNo+' · R'+rev, '<div class="sub">Loading quotation…</div>', '', true);
  gs('api_getQuotation', quoteNo, rev).then(function(d){
    CUR.quote = d;
    var q = d.quote;
    var html = '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">'+
      qStatusChip(q.status)+'<b>'+esc(q.title)+'</b><span class="sub">for '+esc(d.customer.name)+'</span>'+
      '<span class="sub mono" style="margin-left:auto">'+esc(q.date)+' · '+esc(q.by)+'</span></div>';

    var ext = q.source==='External';
    if(ext){
      html += '<div class="card" style="padding:12px 16px;border-left:4px solid var(--blue)"><b>External quotation</b> <span class="sub">— prepared outside the CRM'+(q.fileName?': '+esc(q.fileName):'')+'</span></div>';
    }
    (d.blocks||[]).forEach(function(blk){
      if(blk.title) html += '<div class="ovl" style="margin-top:12px">'+esc(blk.title)+'</div>';
      html += '<div style="overflow-x:auto"><table class="lines"><tr>'+blk.headers.map(function(h){ return '<th>'+esc(h)+'</th>'; }).join('')+'</tr>';
      blk.rows.forEach(function(r){ html += '<tr>'+r.map(function(c){ return '<td>'+esc(c)+'</td>'; }).join('')+'</tr>'; });
      html += '</table></div>';
    });
    html += '<div style="border-top:1.5px solid var(--line);margin-top:8px;padding-top:8px">'+
      (ext ? '' :
        '<div class="totrow"><span>Subtotal</span><b class="money">'+esc(q.currency)+' '+fmtMoney(q.subtotal)+'</b></div>'+
        '<div class="totrow"><span>GST @ '+esc(q.taxPct)+'%</span><b class="money">'+esc(q.currency)+' '+fmtMoney(q.taxAmount)+'</b></div>')+
      '<div class="totrow" style="font-size:15px"><span><b>Total</b></span><b class="money">'+esc(q.currency)+' '+fmtMoney(q.total)+'</b></div></div>';

    html += '<div class="kv" style="margin-top:12px">'+
      '<b>Case</b><span class="mono"><a onclick="closeModal();nav(\'case\',\''+esc(q.caseId)+'\')" style="cursor:pointer">'+esc(q.caseId)+'</a></span>'+
      '<b>'+(ext?'File':'Template')+'</b><span>'+esc(ext?(q.fileName||'—'):(q.templateName||'—'))+'</span>'+
      '<b>Valid until</b><span>'+esc(q.validUntil||'—')+'</span>'+
      '<b>Notes</b><span>'+esc(q.notes||'—')+'</span></div>';

    if(q.doc||q.pdf){
      html += '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">'+
        (q.doc?'<a class="btn ghost sm" href="'+esc(q.doc)+'" target="_blank" rel="noopener">Open Google Doc</a>':'')+
        (q.pdf?'<a class="btn ghost sm" href="'+esc(q.pdf)+'" target="_blank" rel="noopener">'+(ext?'Open uploaded file':'Open PDF')+'</a>':'')+'</div>';
    }
    if(d.revisions.length>1){
      html += '<div class="ovl" style="margin-top:16px">All revisions</div>';
      d.revisions.forEach(function(r){
        var cur = r.rev===q.rev;
        html += '<div class="qr"'+(cur?' style="border-color:var(--brand)"':'')+'><span class="mono">R'+r.rev+'</span>'+qStatusChip(r.status)+
          '<span class="sub mono">'+esc(r.date)+'</span><span class="money" style="margin-left:auto">'+esc(q.currency)+' '+fmtMoney(r.total)+'</span>'+
          (cur?'<span class="badge b-green">Viewing</span>':'<button class="btn ghost sm" onclick="mQuoteViewer(\''+esc(quoteNo)+'\','+r.rev+')">View</button>')+'</div>';
      });
    }

    var foot = '<button class="btn ghost" onclick="closeModal()">Close</button>';
    foot += '<button class="btn ghost" onclick="newRevision()">New revision</button>';
    if(!ext && (q.status==='Draft'||q.status==='Sent')) foot += '<button class="btn ghost" id="genBtn" onclick="genDoc(\''+esc(quoteNo)+'\','+rev+')">'+(q.doc?'Re-generate Doc + PDF':'Generate Doc + PDF')+'</button>';
    if(q.status==='Draft') foot += '<button class="btn" onclick="setQStatus(\''+esc(quoteNo)+'\','+rev+',\'Sent\')">Mark Sent</button>';
    openModal(quoteNo+' · R'+rev, html, foot, true);
  }).catch(function(e){ closeModal(); oops(e); });
}
function genDoc(quoteNo, rev){
  el('genBtn').disabled = true; el('genBtn').textContent = 'Generating…';
  gs('api_generateQuoteDoc', quoteNo, rev).then(function(r){ toast('Document and PDF created.'); mQuoteViewer(quoteNo, rev); })
    .catch(function(e){ if(el('genBtn')){ el('genBtn').disabled=false; el('genBtn').textContent='Generate Doc + PDF'; } oops(e); });
}
function setQStatus(quoteNo, rev, status){
  gs('api_setQuoteStatus', quoteNo, rev, status).then(function(){ toast('Marked '+status+'.'); refreshBehind(); mQuoteViewer(quoteNo, rev); }).catch(oops);
}
function newRevision(){
  var d = CUR.quote; if(!d) return;
  var q = d.quote;
  if(q.source==='External'){
    closeModal();
    mUploadQuote({ quoteNo:q.quoteNo, caseId:q.caseId, title:q.title, total:q.total, currency:q.currency, validUntil:q.validUntil, notes:q.notes, status:q.status });
    return;
  }
  mQuoteBuilder({
    customerId: '', customerName: d.customer.name,
    cases: [{id:q.caseId, title:'(same as previous revision)'}], caseId: q.caseId, lockCase: true,
    base: { quoteNo: q.quoteNo, title: q.title, templateId: q.templateId, taxPct: q.taxPct, currency: q.currency, validUntil: q.validUntil, notes: q.notes, blocks: d.blocks, subtotal: q.subtotal }
  });
  B.ctx.customerId = d.customer.id;
}

/* =====================================================================
 * ADMIN
 * =================================================================== */
function vAdmin(){
  S.route='admin'; S.routeArg=null; setTab('admin');
  if(!isAdmin()){ el('main').innerHTML = '<div class="card"><div class="empty">The Admin area needs L5.</div></div>'; return; }
  el('main').innerHTML = '<div class="pagehead"><div class="grow"><h1>Admin</h1>'+
    '<div class="sub">Users, lists, import and database links.</div></div></div><div id="admBody"><div class="sub">Loading…</div></div>';
  Promise.all([ gs('api_admin_listUsers'), gs('api_admin_links').catch(function(){ return null; }) ])
    .then(function(res){ renderAdmin(res[0], res[1]); }).catch(oops);
}
function renderAdmin(users, links){
  var html = '<div class="card"><div class="ovl">Users &amp; access levels</div>';
  html += '<table><tr><th>Email</th><th>Name</th><th>Level</th><th>Allowed tags</th><th>Status</th><th></th></tr>';
  (users||[]).forEach(function(u){
    var lc = u.role==='L6'?'b-green':(u.role==='L5'?'b-blue':(u.role==='L4'?'b-blue':(u.role==='L1'?'b-grey':'b-amber')));
    html += '<tr><td class="mono">'+esc(u.email)+'</td><td>'+esc(u.name)+'</td>'+
      '<td><span class="badge '+lc+'">'+esc(u.role)+'</span></td>'+
      '<td>'+(u.allowedTags.indexOf('*')>-1?'<span class="chip">All (*)</span>':tagChips(u.allowedTags))+'</td>'+
      '<td>'+(u.active?'<span class="badge b-green">Active</span>':'<span class="badge b-red">Inactive</span>')+'</td>'+
      '<td><button class="btn ghost sm" onclick=\'mUser('+JSON.stringify(u).replace(/'/g,'&#39;')+')\'>Edit</button></td></tr>';
  });
  html += '</table><div style="margin-top:10px"><button class="btn" onclick="mUser(null)">+ Add user</button></div>'+
    '<div class="kv" style="margin-top:14px;grid-template-columns:42px 1fr">'+
    Object.keys({L1:1,L2:1,L3:1,L4:1,L5:1,L6:1}).map(function(k){ return '<b>'+k+'</b><span class="sub">'+esc(LEVEL_DESC[k])+'</span>'; }).join('')+
    '</div></div>';

  html += '<div class="row"><div class="col"><div class="card"><div class="ovl">Customer tags (geographies)</div>'+
    '<textarea id="ad_tags" class="listedit" style="min-height:100px">'+esc(S.settings.tags.join('\n'))+'</textarea>'+
    '<p class="hint">Tags drive access control. Removing a tag does not remove it from customers that already have it.</p>'+
    '<button class="btn sm" onclick="saveSettings({tags:linesOf(\'ad_tags\')})">Save tags</button></div>'+
    '<div class="card"><div class="ovl">Customer types</div>'+
    '<textarea id="ad_types" class="listedit" style="min-height:80px">'+esc(S.settings.types.join('\n'))+'</textarea>'+
    '<button class="btn sm" onclick="saveSettings({types:linesOf(\'ad_types\')})">Save types</button></div>'+
    '<div class="card"><div class="ovl">Priorities</div>'+
    '<textarea id="ad_pri" class="listedit" style="min-height:70px">'+esc(S.settings.priorities.join('\n'))+'</textarea>'+
    '<button class="btn sm" onclick="saveSettings({priorities:linesOf(\'ad_pri\')})">Save priorities</button></div></div>';

  html += '<div class="col"><div class="card"><div class="ovl">Won order categories</div>'+
    '<textarea id="ad_cats" class="listedit" style="min-height:170px">'+esc(S.settings.categories.join('\n'))+'</textarea>'+
    '<p class="hint">One per line. Shown as the multi-select when a case is marked Won.</p>'+
    '<button class="btn sm" onclick="saveSettings({categories:linesOf(\'ad_cats\')})">Save categories</button></div>'+
    '<div class="card"><div class="ovl">Case sources</div>'+
    '<textarea id="ad_sources" class="listedit" style="min-height:90px">'+esc(S.settings.sources.join('\n'))+'</textarea>'+
    '<button class="btn sm" onclick="saveSettings({sources:linesOf(\'ad_sources\')})">Save sources</button></div>'+
    '<div class="card"><div class="ovl">Defaults</div>'+
    '<div class="frow"><div><label>GST %</label><input id="ad_tax" type="number" value="'+esc(S.settings.taxPct)+'"></div>'+
    '<div><label>Currency</label><input id="ad_cur" value="'+esc(S.settings.currency)+'"></div></div>'+
    '<div class="frow"><div><label>Company name (on quotes)</label><input id="ad_co" value="'+esc(S.settings.company)+'"></div></div>'+
    '<button class="btn sm" onclick="saveSettings({taxPct:v(\'ad_tax\'),currency:v(\'ad_cur\'),company:v(\'ad_co\')})">Save defaults</button></div></div></div>';

  html += '<div class="card"><div class="ovl">Import customers from the sheet</div>'+
    '<p style="margin-bottom:8px">Open the database sheet (link below), paste rows into the <b>Import</b> tab under these columns, then run import:</p>'+
    '<p class="mono" style="font-size:12px;background:#FAFBFA;border:1px solid var(--line);border-radius:7px;padding:9px">Name · Tag · Type · Priority · Area · Address · GSTIN · ContactName · ContactDesignation · ContactPhone · ContactEmail · Handlers</p>'+
    '<p class="hint">Handlers accept comma-separated emails (must be active users). Rows whose Name already exists are skipped. Processed rows are cleared. Tip: for everyday use the in-app “Bulk add” on the Customers page is faster.</p>'+
    '<div style="margin-top:10px;display:flex;gap:10px;align-items:center"><button class="btn" id="impBtn" onclick="runImport()">Run customer import</button><span id="impRes" class="sub"></span></div></div>';

  html += '<div class="card"><div class="ovl">Import contacts from the sheet</div>'+
    '<p style="margin-bottom:8px">Paste into the <b>ImportContacts</b> tab to add many contacts across customers at once:</p>'+
    '<p class="mono" style="font-size:12px;background:#FAFBFA;border:1px solid var(--line);border-radius:7px;padding:9px">CustomerName · ContactName · Designation · Phone · Email · Notes</p>'+
    '<p class="hint">CustomerName must match an existing customer exactly. Unmatched rows are reported and skipped. Processed rows are cleared.</p>'+
    '<div style="margin-top:10px;display:flex;gap:10px;align-items:center"><button class="btn" id="impcBtn" onclick="runImportContacts()">Run contact import</button><span id="impcRes" class="sub"></span></div></div>';

  html += '<div class="card"><div class="ovl">Recycle bin — deleted customers</div>'+
    '<p class="hint" style="margin-top:-4px">Customers moved here from the Customers grid. Restoring brings back the customer record (re-add its handlers and contacts afterwards).</p>'+
    '<div id="recycleBin"><div class="sub">Loading…</div></div></div>';
  if(links){
    html += '<div class="card"><div class="ovl">Drive links — never share the database sheet itself</div>'+
      '<div style="display:flex;gap:10px;flex-wrap:wrap">'+
      '<a class="btn ghost sm" href="'+esc(links.db)+'" target="_blank" rel="noopener">Database sheet</a>'+
      '<a class="btn ghost sm" href="'+esc(links.templates)+'" target="_blank" rel="noopener">Templates folder</a>'+
      '<a class="btn ghost sm" href="'+esc(links.quotes)+'" target="_blank" rel="noopener">Generated quotations folder</a></div></div>';
  }
  el('admBody').innerHTML = html;
  loadRecycle();
}
function linesOf(id){ return el(id).value.split(/\r?\n/).map(function(s){ return s.trim(); }).filter(Boolean); }
function loadRecycle(){
  if(!el('recycleBin')) return;
  gs('api_admin_listRecycle').then(renderRecycle).catch(function(e){ if(el('recycleBin')) el('recycleBin').innerHTML='<div class="empty">'+esc(errMsg(e))+'</div>'; });
}
function renderRecycle(d){
  if(!el('recycleBin')) return;
  if(!d.customers.length){ el('recycleBin').innerHTML='<div class="empty">The recycle bin is empty.</div>'; return; }
  var html='<table><tr><th>Customer</th><th>Tag</th><th>Area</th><th>Deleted</th><th></th></tr>';
  d.customers.forEach(function(c){
    html+='<tr><td><b>'+esc(c.name)+'</b> <span class="sub mono">'+esc(c.id)+'</span></td>'+
      '<td>'+tagChips(c.tags)+'</td><td class="sub">'+esc(c.area||'—')+'</td>'+
      '<td class="sub mono">'+esc(c.deletedOn||'')+(c.deletedBy?' · '+esc(c.deletedBy):'')+'</td>'+
      '<td><button class="btn ghost sm" onclick="restoreCust(\''+esc(c.id)+'\')">Restore</button> '+
      '<button class="btn danger sm" onclick="purgeCust(\''+esc(c.id)+'\',\''+esc(c.name).replace(/'/g,"\\'")+'\')">Delete forever</button></td></tr>';
  });
  el('recycleBin').innerHTML=html+'</table>';
}
function restoreCust(id){
  gs('api_admin_restoreCustomer', id).then(function(){ toast('Customer restored.'); loadRecycle(); }).catch(oops);
}
function purgeCust(id, name){
  openModal('Delete forever',
    '<p>Permanently delete <b>'+esc(name)+'</b> from the recycle bin? This cannot be undone.</p>',
    '<button class="btn ghost" onclick="closeModal()">Cancel</button>'+
    '<button class="btn danger" onclick="purgeCust2(\''+esc(id)+'\')">Delete forever</button>');
}
function purgeCust2(id){
  gs('api_admin_purgeCustomer', id).then(function(){ closeModal(); toast('Permanently deleted.'); loadRecycle(); }).catch(oops);
}
function saveSettings(d){
  gs('api_admin_saveSettings', d).then(function(){ toast('Settings saved.'); return gs('api_bootstrap'); })
    .then(function(b){ S.settings = b.settings; }).catch(oops);
}
function runImport(){
  el('impBtn').disabled = true; el('impRes').textContent = 'Importing…';
  gs('api_admin_runImport').then(function(r){
    el('impBtn').disabled = false;
    var msg = r.message ? r.message : (r.created+' created, '+r.skipped.length+' skipped'+(r.skipped.length?': '+r.skipped.join('; '):''));
    el('impRes').textContent = msg; toast('Import finished — '+r.created+' created.');
  }).catch(function(e){ el('impBtn').disabled=false; el('impRes').textContent=''; oops(e); });
}
function runImportContacts(){
  el('impcBtn').disabled = true; el('impcRes').textContent = 'Importing…';
  gs('api_admin_runImportContacts').then(function(r){
    el('impcBtn').disabled = false;
    var msg = r.message ? r.message : (r.created+' added, '+r.skipped.length+' skipped'+(r.skipped.length?': '+r.skipped.join('; '):''));
    el('impcRes').textContent = msg; toast('Contacts imported — '+r.created+' added.');
  }).catch(function(e){ el('impcBtn').disabled=false; el('impcRes').textContent=''; oops(e); });
}
function mUser(u){
  u = u||{};
  openModal(u.email?'Edit user':'Add user',
    '<div class="frow"><div style="flex:1.5"><label class="req">Email</label><input id="au_email" value="'+esc(u.email||'')+'"'+(u.email?' disabled':'')+'></div>'+
    '<div><label>Name</label><input id="au_name" value="'+esc(u.name||'')+'"></div></div>'+
    '<div class="frow"><div><label>Access level</label><select id="au_role" onchange="userLvlHint()">'+
    ['L1','L2','L3','L4','L5','L6'].map(function(r){ return '<option'+(u.role===r?' selected':'')+'>'+r+'</option>'; }).join('')+
    '</select></div>'+
    '<div><label>Status</label><select id="au_active"><option value="1"'+(u.active!==false?' selected':'')+'>Active</option><option value="0"'+(u.active===false?' selected':'')+'>Inactive</option></select></div></div>'+
    '<p class="hint" id="au_hint" style="margin-top:-4px"></p>'+
    '<label>Allowed tags (full access to matching customers; needed for L2/L3)</label>'+
    tagPickerHTML('au_tags', S.settings.tags, u.allowedTags||[], true)+
    '<p class="hint">L4 and L5 see everything regardless of tags.</p>',
    '<button class="btn ghost" onclick="closeModal()">Cancel</button>'+
    '<button class="btn" onclick="saveUser(\''+esc(u.email||'')+'\')">Save user</button>', true);
  userLvlHint();
}
function userLvlHint(){ var r = v('au_role'); if(el('au_hint')) el('au_hint').textContent = LEVEL_DESC[r]||''; }
function saveUser(origEmail){
  var d = { email: origEmail || v('au_email'), name: v('au_name'), role: v('au_role'), active: v('au_active')==='1', allowedTags: pickerVal('au_tags') };
  gs('api_admin_saveUser', d).then(function(){ closeModal(); toast('User saved.'); vAdmin(); }).catch(oops);
}

/* level descriptions mirrored client-side for the Admin UI */
var LEVEL_DESC = {
  L1:'Assignments only — sees only cases assigned to them.',
  L2:'Sales — own dashboard + assignments. Can create customers, cases, quotes, set priority, and assign to others.',
  L3:'L2 + can view the dashboards of L2 users who share a tag, and edit customer tags and type.',
  L4:'L3 + full access to all customers and cases across all tags.',
  L5:'L4 without a sales performance dashboard — back-office, full data access, no Admin.',
  L6:'L5 + Admin (users, lists, import, database links). No performance dashboard.'
};

/* ---------------- go ---------------- */
if(BOOT && BOOT.ok){ init(); } else { renderLock(); }
